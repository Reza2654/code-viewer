name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Publish Release Packages
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Run Unit Tests
        run: dotnet test tests/CodeViewer.Tests/CodeViewer.Tests.csproj -c Release

      - name: Package Release & Compile Installer
        run: powershell -ExecutionPolicy Bypass -File .\scripts\package-release.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CodeViewer-*-Setup.exe
            dist/CodeViewer-*-portable.zip
            dist/CodeViewer-*-winget-manifests.zip
            dist/checksums.sha256
          generate_release_notes: true
          draft: false
